        <circle cx="52" cy="28" r="5.5" fill="#bd93f9"/>
        <rect x="140" y="16" width="104" height="4" rx="2" fill="#44475a"/>
        <rect x="140" y="26" width="104" height="4" rx="2" fill="#44475a"/>
        <rect x="140" y="36" width="104" height="4" rx="2" fill="#44475a"/>
      </g>
      <g transform="translate(0,140)">
