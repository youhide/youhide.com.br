name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:

# Least privilege: read the repo, mint the OIDC token deploy-pages needs,
# and write the Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress stays false: cancelling a
# half-finished deploy can leave the site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # There is no build step, so this is the only thing standing between an
      # edit and production. Fails the job before the upload, so a broken page,
      # a missing translation or a post absent from the feed never ships.
      # python3 is preinstalled on ubuntu-latest; the script needs nothing else.
      - name: Validate site
        run: python3 assets/check-site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
