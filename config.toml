    icon = "fab fa-gitlab fa-2x"
    weight = 2
    url = "https://gitlab.com/youri/"
[[params.social]]
    name = "Linkedin"
    icon = "fab fa-linkedin fa-2x"
    weight = 2
    url = "https://linkedin.com/in/yourimattar"    
[[params.social]]
    name = "Twitter"
